name = "lagah-crash-bot"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Static Mini App files
# ---------------------------------------------------------------------------
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# ---------------------------------------------------------------------------
# D1 database
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "lagah-crash-bot-db"
database_id = "676dfbce-284f-4fde-adf3-99988024d99c"

# ---------------------------------------------------------------------------
# Durable Object
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "CRASH_ROOM"
class_name = "CrashRoom"

[[migrations]]
tag = "v1"
new_classes = ["CrashRoom"]

# ---------------------------------------------------------------------------
# Environment variables
# ---------------------------------------------------------------------------
[vars]
REF_BONUS_PERCENT = "10"
WITHDRAW_FEE_PERCENT = "15"
MIN_WITHDRAW = "50"
HOUSE_EDGE = "0.03"
